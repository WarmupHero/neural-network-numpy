name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      # Runtime dependencies plus the dev extra (pytest, ruff, rdflib, owlrl),
      # so the knowledge-base tests run too. The benchmark extra (TensorFlow,
      # PyTorch) is left out; those tests skip themselves.
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v
